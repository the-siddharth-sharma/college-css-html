
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddharth Sharma</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #111;
        }

        /* Faded background image */
        .background {
            position: fixed;
            inset: 0;
            background-image: url("myphoto.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.25; /* Image transparency */
            z-index: -1;
        }

        /* Text layout */
        .container {
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            align-items: center;
            justify-items: center;
            padding: 20px;
        }

        .text {
            color: white;
            font-size: clamp(16px, 2.5vw, 32px);
            font-weight: bold;
            text-shadow: 2px 2px 6px black;
            text-align: center;
        }

        .top-left {
            justify-self: start;
            align-self: start;
        }

        .top-center {
            align-self: start;
        }

        .top-right {
            justify-self: end;
            align-self: start;
        }

        .center-left {
            justify-self: start;
        }

        .center {
            font-size: clamp(22px, 4vw, 48px);
            color: #ffd700;
        }

        .center-right {
            justify-self: end;
        }

        .bottom-left {
            justify-self: start;
            align-self: end;
        }

        .bottom-center {
            align-self: end;
        }

        .bottom-right {
            justify-self: end;
            align-self: end;
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="container">
        <div class="text top-left">Siddharth Sharma</div>
        <div class="text top-center">Siddharth Sharma</div>
        <div class="text top-right">Siddharth Sharma</div>

        <div class="text center-left">Siddharth Sharma</div>
        <div class="text center">Siddharth Sharma</div>
        <div class="text center-right">Siddharth Sharma</div>

        <div class="text bottom-left">Siddharth Sharma</div>
        <div class="text bottom-center">Siddharth Sharma</div>
        <div class="text bottom-right">Siddharth Sharma</div>
    </div>

</body>
</html>
